<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyDesk</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%236c8cff' rx='18' width='100' height='100'/><text x='50' y='68' font-family='monospace' font-size='48' font-weight='bold' fill='%23ffffff' text-anchor='middle'>SD</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#0e1018;color:#c8cdd8;font-family:Arial,sans-serif;overflow-x:hidden}
.app{position:relative;z-index:1;width:min(1050px,calc(100% - 40px));margin:auto;padding:20px 0 60px}
.header{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:monospace;font-size:28px;font-weight:700;color:#6c8cff;letter-spacing:-1px}
.settings-btn{border:1px solid #2a3040;background:#161a25;color:#6a7080;padding:6px 10px;border-radius:3px;font-size:11px}
.greeting-section{text-align:center;padding:30px 20px 10px}
.greeting-text{font-size:36px;font-weight:700;letter-spacing:-1px;margin-bottom:12px}
.date-display{display:flex;flex-direction:column;align-items:center;line-height:1;margin-bottom:10px}
.date-day{font-size:12px;color:#6c8cff;font-weight:700;letter-spacing:2px}
.date-num{font-size:52px;font-weight:700;letter-spacing:-3px;line-height:0.9}
.date-month{font-size:12px;color:#6a7080;letter-spacing:2px;margin-top:2px}
.greeting-sub{color:#6a7080;font-size:13px}
.main-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.grid-left,.grid-right{display:flex;flex-direction:column;gap:12px}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.eyebrow{color:#6c8cff;font-size:9px;text-transform:uppercase;margin-bottom:4px}
.notes-section{padding:10px;border:1px solid #2a3040;background:#161a25}
#notesArea{width:100%;min-height:90px;border:1px solid #2a3040;outline:0;background:#0e1018;color:#c8cdd8;padding:7px;font-size:11px;font-family:Arial,sans-serif;resize:vertical}
#notesArea::placeholder{color:#444}
#clearNotesBtn{border:1px solid #2a3040;background:#1c2030;color:#6a7080;padding:3px 7px;font-size:9px}
#clearNotesBtn:hover{color:#ff6b6b}
.weather-section{padding:10px;border:1px solid #2a3040;background:#161a25}
.weather-input{display:flex;gap:3px;margin-bottom:5px}
.weather-input input{flex:1;border:1px solid #2a3040;outline:0;background:#0e1018;color:#c8cdd8;padding:4px 6px;font-size:10px}
.weather-input button{border:0;background:#6c8cff;color:#fff;padding:4px 8px;font-size:9px;font-weight:700}
#weatherBox{color:#6a7080;font-size:11px}
#weatherBox strong{color:#c8cdd8;font-size:15px}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="app">
<header class="header">
<div></div>
<a href="#" class="logo">StudyDesk</a>
<div style="width:60px"></div>
</header>

<div class="greeting-section">
<p class="greeting-text">Welcome.</p>
<div class="date-display">
<span class="date-day" id="dateDay">THU</span>
<span class="date-num" id="dateNum">17</span>
<span class="date-month" id="dateMonth">SEPTEMBER 2026</span>
</div>
<p class="greeting-sub">Your study workspace</p>
</div>

<div class="main-grid">
<div class="grid-left">
<section class="notes-section">
<div class="section-heading">
<p class="eyebrow">Quick Notes</p>
<button id="clearNotesBtn">Clear</button>
</div>
<textarea id="notesArea" placeholder="lecture notes, formulas, ideas..."></textarea>
</section>
</div>
<div class="grid-right">
<section class="weather-section">
<div class="section-heading"><p class="eyebrow">Weather</p></div>
<div class="weather-input"><input type="text" id="weatherCity" placeholder="city..."><button id="weatherGoBtn">Go</button></div>
<div id="weatherBox">type a city</div>
</section>
</div>
</div>
</main>
</body>
</html>
